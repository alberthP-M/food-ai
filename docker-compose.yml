services:
  backend:
    build:
      context: ./backend
    environment:
      MODEL_BACKEND: fastembed
      MODEL_NAME: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      DATA_DIR: /app/data
      ARTIFACT_DIR: /app/artifacts
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 45s
    volumes:
      - model_cache:/root/.cache/huggingface
      - backend_artifacts:/app/artifacts

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  model_cache:
  backend_artifacts:
